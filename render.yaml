# Render Blueprint (free plan). Free servers have no persistent disk, so the data lives in a free Turso database.
services:
  - type: web
    name: budget-desk
    runtime: docker
    plan: free           # sleeps after ~15 min idle; the first request then takes about a minute
    region: singapore    # closest to India
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: APP_TZ
        value: Asia/Kolkata
      - key: APP_PASSWORD     # you type these four in the Render dashboard
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
