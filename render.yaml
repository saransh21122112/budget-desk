# Render Blueprint: New > Blueprint > pick this repo. SQLite lives on the disk, so keep it to one instance.
services:
  - type: web
    name: budget-desk
    runtime: docker
    plan: starter        # persistent disks are not available on the free plan
    region: singapore    # closest to India
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: BUDGET_DB
        value: /data/budget.db
      - key: APP_TZ
        value: Asia/Kolkata
      - key: APP_PASSWORD   # you type these two in the Render dashboard
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: budget-data
      mountPath: /data
      sizeGB: 1
